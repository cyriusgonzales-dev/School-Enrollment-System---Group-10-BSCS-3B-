<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <title>Enrollment Form | Alvarez Academy Crest</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="enrollment" class="page">
  <div class="header">
    <img src="/logo.png" alt="Logo" class="logo">
    <div class="school-name">Alvarez Academy Crest<br><small>Senior High School</small></div>
    <div class="nav">
      <a href="index.html">Home</a>
      <a href="enrollment.html" class="active">Enroll</a>
      <a href="status.html">Check Status</a>
    </div>
  </div>

  <div class="content form-content">
    <form id="enrollForm" class="box">
      <h2>Enrollment Form</h2>
      <p>School Year: <b class="sy"></b> | Semester: <b class="sem"></b></p>

      <div class="row">
        <!-- Left column: personal information -->
        <div class="column">
          <label>Full Name</label>
          <input id="fullName" placeholder="Juan Santos Dela Cruz">

          <label>Date of Birth</label>
          <input type="date" id="dateOfBirth">

          <label>Sex</label>
          <select id="sex">
            <option value="">Select</option>
            <option>Male</option>
            <option>Female</option>
          </select>

          <label>Complete Address</label>
          <input id="address" placeholder="House No., Street, Barangay, City, Province">
        </div>

        <!-- Right column: contact and program -->
        <div class="column">
          <label>Contact Number</label>
          <input id="contactNumber" placeholder="09171234567" maxlength="11">

          <label>Grade Level</label>
          <select id="gradeLevel">
            <option value="">Select</option>
            <option>Grade 11</option>
            <option>Grade 12</option>
          </select>

          <label>Track</label>
          <select id="track"></select>

          <label>Strand</label>
          <select id="strand"><option value="">Select a track first</option></select>
        </div>
      </div>

      <p id="message" class="message"></p>
      <button class="navy">Submit Application</button>
    </form>

    <div id="success" class="box center" style="display: none;">
      <h2>Application Submitted!</h2>
      <p>Your reference number is:</p>
      <p class="ref" id="refNumber"></p>
      <p>Please save this number to check your application status.</p>
      <a href="status.html" class="button navy">Check Status</a>
    </div>
  </div>

  <div class="footer">&copy; Alvarez Academy Crest - Senior High School</div>
  <script src="/script.js"></script>
</body>
</html>
